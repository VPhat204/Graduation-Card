<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with dark navy -->
  <rect width="64" height="64" rx="14" fill="#1a1a2e"/>

  <!-- Graduation cap board (top flat part) -->
  <polygon points="32,14 56,24 32,34 8,24" fill="#c9a227"/>

  <!-- Cap board shine -->
  <polygon points="32,14 56,24 54,25 32,15.5" fill="#f0d060" opacity="0.4"/>

  <!-- Cap body / mortarboard top -->
  <rect x="24" y="29" width="16" height="11" rx="2" fill="#c9a227"/>
  <!-- Shadow on cap body -->
  <rect x="24" y="29" width="16" height="3" rx="1" fill="#a07d10" opacity="0.5"/>

  <!-- Tassel string -->
  <line x1="52" y1="25" x2="52" y2="38" stroke="#c9a227" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel end cluster -->
  <circle cx="52" cy="39" r="3" fill="#c9a227"/>
  <line x1="49" y1="41" x2="47" y2="46" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="42" x2="52" y2="47" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="41" x2="57" y2="46" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Star sparkle top left -->
  <g opacity="0.8">
    <line x1="12" y1="10" x2="12" y2="14" stroke="#f0d060" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="12" x2="14" y2="12" stroke="#f0d060" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Star sparkle right -->
  <g opacity="0.6">
    <line x1="54" y1="10" x2="54" y2="13" stroke="#f0d060" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="52.5" y1="11.5" x2="55.5" y2="11.5" stroke="#f0d060" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>